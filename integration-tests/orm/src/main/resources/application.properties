quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

mp.messaging.outgoing.outbox-events.connector=smallrye-amqp
mp.messaging.outgoing.outbox-events.address=outbox-events

mp.messaging.incoming.events-in.connector=smallrye-amqp
mp.messaging.incoming.events-in.address=outbox-events

mp.messaging.outgoing.kafka-outbox.connector=smallrye-kafka
mp.messaging.outgoing.kafka-outbox.topic=outbox-topic
mp.messaging.outgoing.kafka-outbox.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.kafka-outbox.key.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.outgoing.kafka-record-outbox.connector=smallrye-kafka
mp.messaging.outgoing.kafka-record-outbox.topic=outbox-topic
mp.messaging.outgoing.kafka-record-outbox.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.kafka-record-outbox.key.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.incoming.kafka-in.connector=smallrye-kafka
mp.messaging.incoming.kafka-in.topic=outbox-topic
mp.messaging.incoming.kafka-in.auto.offset.reset=earliest

mp.messaging.outgoing.fallback-events.connector=smallrye-amqp
mp.messaging.outgoing.fallback-events.address=fallback-events
mp.messaging.outgoing.fallback-events.outbox.mode=fallback
mp.messaging.outgoing.fallback-events.outbox.fallback.timeout=2s

mp.messaging.incoming.fallback-in.connector=smallrye-amqp
mp.messaging.incoming.fallback-in.address=fallback-events

# Object payloads: the relay deserializes them into their stored class before Kafka serializes them again.
mp.messaging.outgoing.pojo-outbox.connector=smallrye-kafka
mp.messaging.outgoing.pojo-outbox.topic=pojo-topic

mp.messaging.incoming.pojo-in.connector=smallrye-kafka
mp.messaging.incoming.pojo-in.topic=pojo-topic
mp.messaging.incoming.pojo-in.auto.offset.reset=earliest
mp.messaging.incoming.pojo-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Workaround for GraalVM/Mandrel aarch64 ADR overflow with Kafka (quarkusio/quarkus#57390)
quarkus.native.additional-build-args-append=-H:-AOTSingleCallsiteInline

# Deduplication: the store loses the first delivered() call, so the relay re-sends. Artemis drops
# the second copy via _AMQ_DUPL_ID.
mp.messaging.outgoing.amqp-dedup.connector=smallrye-amqp
mp.messaging.outgoing.amqp-dedup.address=amqp-dedup
mp.messaging.outgoing.amqp-dedup.outbox.store=lost-first-ack
mp.messaging.outgoing.amqp-dedup.outbox.poll-interval=500ms
mp.messaging.outgoing.amqp-dedup.outbox.lease-duration=3s

mp.messaging.incoming.amqp-dedup-in.connector=smallrye-amqp
mp.messaging.incoming.amqp-dedup-in.address=amqp-dedup

mp.messaging.outgoing.amqp-app-id.connector=smallrye-amqp
mp.messaging.outgoing.amqp-app-id.address=amqp-app-id

mp.messaging.incoming.amqp-app-id-in.connector=smallrye-amqp
mp.messaging.incoming.amqp-app-id-in.address=amqp-app-id
