quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

mp.messaging.outgoing.rabbitmq-outbox.connector=smallrye-rabbitmq
mp.messaging.outgoing.rabbitmq-outbox.exchange.name=outbox-exchange

mp.messaging.incoming.rabbitmq-in.connector=smallrye-rabbitmq
mp.messaging.incoming.rabbitmq-in.exchange.name=outbox-exchange
mp.messaging.incoming.rabbitmq-in.queue.name=outbox-queue

# Deduplication ids on RabbitMQ. The store loses the first delivered() call, so the relay re-sends.
mp.messaging.outgoing.rabbitmq-dedup.connector=smallrye-rabbitmq
mp.messaging.outgoing.rabbitmq-dedup.exchange.name=dedup-exchange
mp.messaging.outgoing.rabbitmq-dedup.outbox.store=lost-first-ack
mp.messaging.outgoing.rabbitmq-dedup.outbox.poll-interval=500ms
mp.messaging.outgoing.rabbitmq-dedup.outbox.lease-duration=3s

mp.messaging.incoming.rabbitmq-dedup-in.connector=smallrye-rabbitmq
mp.messaging.incoming.rabbitmq-dedup-in.exchange.name=dedup-exchange
mp.messaging.incoming.rabbitmq-dedup-in.queue.name=dedup-queue

mp.messaging.outgoing.rabbitmq-app-id.connector=smallrye-rabbitmq
mp.messaging.outgoing.rabbitmq-app-id.exchange.name=app-id-exchange

mp.messaging.incoming.rabbitmq-app-id-in.connector=smallrye-rabbitmq
mp.messaging.incoming.rabbitmq-app-id-in.exchange.name=app-id-exchange
mp.messaging.incoming.rabbitmq-app-id-in.queue.name=app-id-queue
